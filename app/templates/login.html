<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ app_name }} — Iniciar Sesión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body class="login-bg d-flex align-items-center justify-content-center min-vh-100">

<div class="login-card card shadow-lg p-4" style="min-width:360px; max-width:420px; width:100%">
  <div class="text-center mb-4">
    <i class="bi bi-kanban-fill fs-1 text-primary"></i>
    <h4 class="mt-2 fw-bold">{{ app_name }}</h4>
    <p class="text-muted small">Gestión de Tableros Kanban</p>
  </div>

  {% if error %}
  <div class="alert alert-danger py-2 small">
    <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
  </div>
  {% endif %}

  {% if not otp_sent %}
  <!-- ── Password login ──────────────────────────────────────────── -->
  <form method="post" action="/login" id="loginForm">
    <div class="mb-3">
      <label class="form-label fw-semibold">Correo electrónico</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" name="email" class="form-control" placeholder="usuario@empresa.com" required autofocus />
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Contraseña</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" id="pwdInput" class="form-control" placeholder="••••••••" required />
        <button type="button" class="btn btn-outline-secondary" onclick="togglePwd()">
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100 mb-3">
      <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
    </button>
  </form>

  <div class="text-center">
    <span class="text-muted small">¿Prefieres un código temporal?</span>
    <form method="post" action="/login/otp/request" class="mt-2">
      <div class="input-group input-group-sm">
        <input type="email" name="email" class="form-control" placeholder="tu@correo.com" required />
        <button type="submit" class="btn btn-outline-secondary">
          <i class="bi bi-send"></i> Enviar código
        </button>
      </div>
    </form>
  </div>

  {% else %}
  <!-- ── OTP verification ────────────────────────────────────────── -->
  {% if otp_message %}
  <div class="alert alert-info py-2 small">
    <i class="bi bi-info-circle me-1"></i>{{ otp_message }}
  </div>
  {% endif %}

  <form method="post" action="/login/otp/verify">
    <input type="hidden" name="email" value="{{ otp_email }}" />
    <div class="mb-3">
      <label class="form-label fw-semibold">Código de acceso</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-key"></i></span>
        <input type="text" name="token" class="form-control font-monospace"
               placeholder="Pega tu código aquí" required autofocus autocomplete="off" />
      </div>
      <div class="form-text">Enviado a <strong>{{ otp_email }}</strong></div>
    </div>
    <button type="submit" class="btn btn-success w-100 mb-3">
      <i class="bi bi-check2-circle me-1"></i> Verificar código
    </button>
  </form>
  <a href="/login" class="btn btn-link w-100 btn-sm text-muted">← Volver al login</a>
  {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd() {
  const i = document.getElementById('pwdInput');
  const icon = document.getElementById('eyeIcon');
  if (i.type === 'password') {
    i.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    i.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
</script>
</body>
</html>
